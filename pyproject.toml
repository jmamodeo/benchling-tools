[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchling-tools"
dynamic = ["version"]
description = "Safe, auditable tools for AI agents working in Benchling"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "John Amodeo", email = "120539773+jmamodeo@users.noreply.github.com" }]
keywords = [
  "benchling",
  "eln",
  "cli",
  "mcp",
  "model-context-protocol",
  "lab-automation",
  "laboratory-informatics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "filelock>=3.16",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "mcp>=1.13,<2",
  "pydantic>=2.8,<3",
  "typer>=0.12,<0.30",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "pyyaml>=6,<7",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/jmamodeo/benchling-tools"
Repository = "https://github.com/jmamodeo/benchling-tools"
Issues = "https://github.com/jmamodeo/benchling-tools/issues"
Changelog = "https://github.com/jmamodeo/benchling-tools/blob/main/CHANGELOG.md"

[project.scripts]
benchling-tools = "benchling_tools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "benchling_tools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/benchling-tools" = ["SKILL.md"]
"share/benchling-tools/schemas" = ["schemas/*.json"]
"share/benchling-tools/contracts" = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not wheel'"
markers = ["wheel: builds or reads the wheel; run in the CI build job with -m wheel"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # the formatter wraps code; long strings and comments are tolerated
  "B008",  # typer uses call expressions in argument defaults
  "B905",  # zip() strictness would change behavior
  "UP042", # StrEnum would change the str() and format() output of these enums
  "E402",
]

[tool.mypy]
python_version = "3.11"
files = ["src/benchling_tools"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["benchling_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 9
fail_under = 96
