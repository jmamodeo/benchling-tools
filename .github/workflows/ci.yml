name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=96

  native-keyring:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            backend: keyring.backends.macOS.Keyring
          - os: windows-latest
            backend: keyring.backends.Windows.WinVaultKeyring
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Create temporary macOS keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain_pass=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_pass" "$RUNNER_TEMP/benchlingtk-test.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/benchlingtk-test.keychain"
          security default-keychain -d user -s "$RUNNER_TEMP/benchlingtk-test.keychain"
          security unlock-keychain -p "$keychain_pass" "$RUNNER_TEMP/benchlingtk-test.keychain"
      - name: Exercise native keyring
        env:
          BENCHLINGTK_NATIVE_KEYRING_TEST: "1"
          PYTHON_KEYRING_BACKEND: ${{ matrix.backend }}
        run: uv run pytest tests/test_native_keyring.py
      - name: Delete temporary macOS keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/benchlingtk-test.keychain" || true

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Validate SKILL.md
        # skills-ref 0.1.1 provides `agentskills`. Pass the absolute path:
        # `validate .` reports an empty directory name.
        run: uvx --from skills-ref==0.1.1 agentskills validate "$PWD"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine==6.2.0 check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          uv venv --python 3.12 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/benchlingtk --version
          test -s /tmp/wheel-venv/share/benchlingtk/SKILL.md
          cmp /tmp/wheel-venv/share/benchlingtk/SKILL.md SKILL.md
          test "$(/tmp/wheel-venv/bin/benchlingtk skill path)" = /tmp/wheel-venv/share/benchlingtk/SKILL.md
          /tmp/wheel-venv/bin/benchlingtk skill show | cmp - SKILL.md
      - name: Check SKILL.md in the built wheel
        env:
          BENCHLINGTK_WHEEL_DIR: dist
        run: uv run --extra dev pytest -m wheel tests/test_skill_package.py
